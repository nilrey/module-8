apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-model-inference-nil
  namespace: r-mlops-k8s-9-1-3-22209764
spec:
  predictor:
    annotations:
      autoscaling.knative.dev/minScale: "1"           # минимум 1 под
      autoscaling.knative.dev/maxScale: "5"           # максимум 5 подов
      autoscaling.knative.dev/initial-scale: "2"      # старт с 2 подов
      autoscaling.knative.dev/metric: "rps"           # метрика автоскейла
      autoscaling.knative.dev/target: "50"            # целевое значение запросов на под
      autoscaling.knative.dev/targetUtilizationPercentage: "70"
    serviceAccountName: s3-sa-nil
    model:
      modelFormat:
        name: sklearn                                 # В modelFormat укажите sklearn.
      args: ["--enable_docs_url=True"]
      protocolVersion: v2                             # Явно укажите вторую версию протокола в protocolVersion
      runtime: kserve-sklearnserver
      storageUri: s3://r-mlops-bucket-9-1-3-22209764/my_best_model/model.pkl
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "100m"
          memory: "512Mi"